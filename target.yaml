target_id: sharp-degree-tetrahedral-face-volume-moments
revision_date: 2026-10-22
intended_contribution_unit: theorem_and_construction
claim:
  exact_statement: |
    Let M_n collect all normalised moments on each face of a tetrahedron
    against P_n and all cell moments against P_(n-1), n >= 1. Its kernel on
    P_(n+2) has dimension exactly seven and is spanned by four vertex Jacobi
    ridges and three complementary-pair Legendre ridges. The number of missing
    moment directions on P_(n+2) is (n-1)(n-2)/2, and M_n is surjective on
    P_(n+3). Among single-cell polynomial spaces containing P_(n+1) on which
    exactly these moments are unisolvent, the minimum degree is n+2 for n=1,2
    and n+3 for n>=3. Every such space has at least (n-1)(n-2)/2 directions
    outside P_(n+2), and vertex-invariant spaces attaining this exist for
    every n. For n=3 the alternating face functional vanishes on P_5 and
    equals 1/34650 on the Vandermonde sextic, which answers the quintic question
    of the source in the negative. A 50-dimensional vertex-invariant element
    with one sextic is given explicitly.
  evidence_labels:
    proof: [kernel theorem, deficit, surjectivity on P_(n+3) for d=3, minimum degree, alternating obstruction, minimal enrichment count, existence of lean invariant elements, d-simplex kernel dimension, deficit closed form c(d,n), 2D corollary, 14-monomial basis, Fortin and error estimates]
    exact_computation: [cokernel character sgn x Sym^(n-3)(std) via a generating-function identity, lean element P_(n+2)+Delta4*P_(n-3) for n=3..8, explicit n=4 and n=5 elements, surjectivity on P_(n+3) for d=4 n<=5, d=5 n<=4, d=6 n=3]
    numerical: [Stokes convergence rates for n=3 on Kuhn meshes N=1..5, discrete inf-sup constants N=1..4, conditioning of local bases]
    conjecture: [lean enrichment Delta4*P_(n-3) for all n, sharp degree n+3 on every d-simplex with d>=3]
  exclusions:
    - Degree optimality is relative to the specified moments, single-cell polynomial spaces and reproduction of P_(n+1).
    - No minimum-degree assertion for split-cell, nonpolynomial or virtual element spaces, or for all Stokes elements.
    - No pointwise divergence-free or pressure-robustness assertion.
    - No p-uniform stability, curved-element result, discrete Korn inequality or solver-speed claim.
    - Lean elements for n>=5 are given by an existence theorem; the explicit choice Delta4*P_(n-3) is verified only for n<=8.
    - Sharp degree n+3 is proved only for d=3 (and n+2 for d=2).
